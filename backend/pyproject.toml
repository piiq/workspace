[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [{ name = "OpenBB Team", email = "hello@openbb.co" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1,<0.142.0",
    "starlette>=1.6.0,<2.0.0",
    "azure-storage-blob>=12.28.0,<13.0.0",
    "azure-identity>=1.25.0,<2.0.0",
    "SQLAlchemy>=2.0.50,<3.0.0",
    "pytz>=2025.2.0,<2026.0.0",
    "SQLAlchemy-Utils>=0.42.1,<0.43.0",
    "requests>=2.34.2,<3.0.0",
    "alembic>=1.18.4,<2.0.0",
    "bcrypt>=4.1,<5.0",
    "python-multipart>=0.0.32,<0.0.33",
    "email-validator>=2.3.0,<3.0.0",
    "aiomysql==0.3.2",
    "PyMySQL>=1.2.0,<2.0.0",
    "rq>=1.16.2,<2.0.0",
    "redis>=7.1.0,<8.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "gunicorn>=26.0.0,<27.0.0",
    "uvicorn>=0.52.3,<0.53.0",
    "uvicorn-worker>=0.4.0,<0.5.0",
    "loguru>=0.7.3,<0.8.0",
    "fastapi-pagination>=0.15.16,<0.16.0",
    "slowapi",
    "prometheus-fastapi-instrumentator>=8.0.0,<9.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "python-slugify>=8.0,<9.0",
    "hubspot-api-client>=12.0.0,<13.0.0",
    "pyotp>=2.9,<3.0",
    "cryptography>=50.0.0,<51.0.0",
    "pyjwt>=2.15.0,<3.0.0",
    "aiohttp>=3.14.4,<4.0.0",
    "tornado>=6.6,<7.0.0",
    "h11>=0.16.0,<0.17.0",
    "mailchimp-transactional>=1.3.3,<2.0.0",
    "mailchimp-marketing>=3.0.80,<4.0.0",
    "wheel>=0.46.3,<0.47.0",
    "httpx>=0.28.1,<0.29.0",
    "idna>=3.18,<4.0",
    "certifi>=2026.10.18,<2027.0.0",
    "aioboto3>=15.5.0,<16.0.0",
    "greenlet>=3.5.1,<4.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "pg8000>=1.31.6,<2.0.0",
    "aiosqlite>=0.22.0,<0.23.0",
    "fastmcp>=3.4.10,<4.0.0",
    "openbb-ai>=2.1.0,<3.0.0",
    # Required by api/old_aes.py.
    "pycryptodome>=3.23.0,<4.0.0",
]

[dependency-groups]
dev = [
    "vcrpy>=8.3.0; platform_python_implementation == 'CPython'",
    "pytest>=9.0.3,<10.0.0",
    "pytest-mock>=3,<4",
    "pytest-vcr>=1,<2",
    "pytest-env>=1,<2",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "testcontainers[mysql,postgres,redis]>=4.8,<5.0",
    "types-pymysql>=1,<2",
    "types-pytz>=2024,<2025",
    "types-cachetools>=5,<6",
    { include-group = "lint" },
]
lint = ["ruff>=0.16.10,<0.17.0", "ty>=0.0.15,<0.0.16"]

[tool.uv]
package = false

[tool.uv.sources]
slowapi = { git = "https://github.com/laurentS/slowapi", rev = "d3442b2e1425a9db535732a0a06248470c7f9fd5" }

[tool.ruff]
line-length = 122
target-version = "py312"

[tool.ruff.lint]
ignore = ["S311", "PLW1514", "PLW0717", "UP040", "UP046", "UP047"]
select = [
    "E",
    "W",
    "F",
    "Q",
    "W",
    "S",
    "UP",
    "I",
    "PD",
    "SIM",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "T20",
    "PYI",
]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E402",
    "I001",
    "PLC0415",
    "PLC2701",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "PLR6301",
    "S101",
    "S105",
    "S106",
    "S110",
    "S311",
    "S404",
    "S608",
    "SIM105",
]
"tests/stress/*" = ["T201", "PLR0914", "PLR0915"]
"tests/test_bridge_load.py" = ["T201", "PLR0914", "PLR0915"]
"alembic/versions/*" = ["E501", "Q000"]
"alembic/versions_archive/*" = ["E501", "Q000"]
"alembic/*" = ["SIM105"]
"*/__init__.py" = ["F401"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
known-first-party = ["api"]
