services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    tty: true
    ports:
      - "3306:3306"
    networks:
      local-net:
        aliases:
          - mysql
    environment:
      TZ: America/New_York
      LANG: C.UTF_8
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - db:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: always
    container_name: redis
    ports:
      - 6379:6379
    networks:
      - local-net
    env_file:
      - ../backend/envs/.env
    command: redis-server --save 20 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - data:/redis

  fastapi:
    init: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
    container_name: fastapi
    env_file:
      - ../backend/envs/.env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    command:
      [
        "sh",
        "-c",
        "python -m alembic upgrade head && exec python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /opt/code",
      ]
    ports:
      - "8000:8000"
    networks:
      local-net:
        aliases:
          - fastapi
    volumes:
      - ../backend:/opt/code
      - workspace-data:/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  rq_worker:
    init: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
    command: ["worker"]
    container_name: rq_worker
    env_file:
      - ../backend/envs/.env
    environment:
      # Override .env values: inside Docker network, use container names not localhost
      DB_HOST: mysql
      REDIS_HOST: redis
    networks:
      - local-net
    volumes:
      - ../backend:/opt/code
      - workspace-data:/data
    develop:
      watch:
        - action: sync+restart
          path: ../backend
          target: /opt/code
          ignore:
            - .git/
            - __pycache__/
            - .pytest_cache/
            - .ruff_cache/
            - htmlcov/
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  local-net:
    driver: bridge

volumes:
  workspace-data:
  data:
    driver: local
  db:
    driver: local
