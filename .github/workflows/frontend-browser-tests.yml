name: Frontend Local Browser Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/plugin-sdk/src/**'
      - 'packages/plugin-sdk/package.json'
      - 'packages/plugin-sdk/bun.lock'
      - 'scripts/prepare-frontend.ts'
      - 'examples/plugins/basic-widget/**'
      - 'frontend/plugin-build.ts'
      - 'frontend/vite.config.ts'
      - 'frontend/src/main.tsx'
      - 'frontend/package.json'
      - 'frontend/bun.lock'
      - 'frontend/tests/e2e/**'
      - 'frontend/playwright.config.ts'
      - 'frontend/src/lib/plugins/**'
      - 'frontend/src/lib/widgetData.ts'
      - 'frontend/src/hooks/useWidgetDataExport.ts'
      - 'frontend/src/components/AI/hooks/useGetCopilotWidgets.tsx'
      - 'frontend/src/components/AI/hooks/useFunctionCall.tsx'
      - 'frontend/src/components/AI/hooks/mcp/useMcpExecutor.ts'
      - 'frontend/src/components/Widgets/index.ts'
      - 'frontend/src/components/Widget.tsx'
      - 'frontend/src/components/Widgets/charting/RawDataTable.tsx'
      - 'frontend/src/components/General/Table/hooks/useTableContext.tsx'
      - '.github/workflows/frontend-browser-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --with dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node24-bun-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('frontend/package.json', 'frontend/bun.lock', 'packages/plugin-sdk/package.json') }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install SDK runtime dependencies
        working-directory: packages/plugin-sdk
        run: bun install --frozen-lockfile --production

      - name: Cache example plugin dependencies
        uses: actions/cache@v4
        with:
          path: examples/plugins/basic-widget/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node24-bun-${{ steps.setup-bun.outputs.bun-version }}-plugins-${{ hashFiles('packages/plugin-sdk/package.json', 'examples/plugins/basic-widget/package.json', 'examples/plugins/basic-widget/bun.lock') }}

      - name: Install Chromium
        run: bun run playwright install --with-deps chromium

      - name: Run local browser tests
        run: bun run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
