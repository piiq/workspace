name: Workspace Images

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/tests/**'
      - '!frontend/**/*.md'
      - 'backend/**'
      - '!backend/tests/**'
      - '!backend/envs/**'
      - '!backend/**/*.md'
      - 'admin_cli/openbb-admin'
      - 'packages/plugin-sdk/**'
      - '!packages/plugin-sdk/**/*.md'
      - 'docker/**'
      - '!docker/**/*.md'
      - 'scripts/build-images.sh'
      - 'scripts/render-frontend-config.sh'
      - '.dockerignore'
      - '.github/workflows/workspace-images.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified images to GHCR
        type: boolean
        default: false
      release_tags:
        description: Additional comma-separated tags when publishing
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: workspace-images-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH_IMAGES: ${{ github.event_name == 'push' || inputs.publish }}
  RELEASE_TAGS: ${{ inputs.release_tags }}

jobs:
  build:
    name: Build and check ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      WORKSPACE_IMAGE_TAG: sha-${{ github.sha }}-${{ matrix.arch }}
      WORKSPACE_IMAGE_PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Check publication options
        run: |
          if [[ "$PUBLISH_IMAGES" != true && -n "$RELEASE_TAGS" ]]; then
            echo 'Enable publishing to supply release tags.' >&2
            exit 2
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up uv
        uses: astral-sh/setup-uv@main
        with:
          version: '0.13.6'
          enable-cache: true
          working-directory: backend
          cache-dependency-glob: uv.lock
          activate-environment: true

      - name: Install Python test dependencies
        working-directory: backend
        run: uv sync --locked --only-group dev

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@v2

      - name: Cache browser test dependencies
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            packages/plugin-sdk/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node24-bun-${{ steps.bun.outputs.bun-version }}-image-checks-${{ hashFiles('frontend/bun.lock', 'frontend/package.json', 'packages/plugin-sdk/bun.lock', 'packages/plugin-sdk/package.json') }}

      - name: Install browser test dependencies
        run: |
          bun install --cwd frontend --frozen-lockfile
          bun install --cwd packages/plugin-sdk --frozen-lockfile --production
          cd frontend
          bun run playwright install --with-deps chromium

      - name: Restore image build cache
        uses: actions/cache@v4
        with:
          path: .build/build-cache
          key: workspace-buildkit-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: workspace-buildkit-${{ matrix.arch }}-

      - name: Build local images
        env:
          BUILD_CACHE_TO: type=local,dest=${{ github.workspace }}/.build/build-cache-next,mode=max
        run: |
          if [[ -f .build/build-cache/index.json ]]; then
            export BUILD_CACHE_FROM="type=local,src=$PWD/.build/build-cache"
          fi
          ./scripts/build-images.sh --platform "$WORKSPACE_IMAGE_PLATFORM" --tag "$WORKSPACE_IMAGE_TAG"

      - name: Test combined and separate deployments
        run: pytest docker/tests -v -s

      - name: Log in to GHCR
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified images
        if: env.PUBLISH_IMAGES == 'true'
        run: |
          for image in workspace-frontend workspace-backend workspace; do
            destination="ghcr.io/${GITHUB_REPOSITORY,,}${image#workspace}"
            docker tag "$image:$WORKSPACE_IMAGE_TAG" "$destination:$WORKSPACE_IMAGE_TAG"
            docker push "$destination:$WORKSPACE_IMAGE_TAG"
          done

      - name: Save image build cache
        run: |
          rm -rf .build/build-cache
          mv .build/build-cache-next .build/build-cache

      - name: Upload browser check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-checks-${{ matrix.arch }}
          path: .build/image-checks/${{ matrix.arch }}/
          if-no-files-found: ignore

  publish:
    name: Publish multi-platform manifests
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble tags from verified images
        id: images
        run: |
          set -euo pipefail
          IFS=',' read -r -a releases <<< "$RELEASE_TAGS"
          for target in workspace-frontend workspace-backend workspace; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}${target#workspace}"
            tags=(--tag "$image:sha-$GITHUB_SHA" --tag "$image:latest")
            for release in "${releases[@]}"; do tags+=(--tag "$image:$release"); done
            metadata="$RUNNER_TEMP/$target.json"
            docker buildx imagetools create --metadata-file "$metadata" "${tags[@]}" "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
            digest="$(jq -er '."containerimage.descriptor".digest' "$metadata")"
            key="${target#workspace-}"
            echo "${key}_name=$image" >> "$GITHUB_OUTPUT"
            echo "${key}_digest=$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Attest frontend image
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.images.outputs.frontend_name }}
          subject-digest: ${{ steps.images.outputs.frontend_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest backend image
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.images.outputs.backend_name }}
          subject-digest: ${{ steps.images.outputs.backend_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest combined image
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.images.outputs.workspace_name }}
          subject-digest: ${{ steps.images.outputs.workspace_digest }}
          push-to-registry: true
          create-storage-record: false
