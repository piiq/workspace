name: Backend and Admin CLI Lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**/*.py'
      - 'backend/pyproject.toml'
      - 'backend/poetry.lock'
      - 'admin_cli/**/*.py'
      - 'admin_cli/openbb-admin'
      - '.github/workflows/backend-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("backend/poetry.lock").read_text())
          version = next(package["version"] for package in lock["package"] if package["name"] == "ruff")
          subprocess.run([sys.executable, "-m", "pip", "install", f"ruff=={version}"], check=True)
          PY
      - run: |
          ruff check --output-format=github backend admin_cli admin_cli/openbb-admin
