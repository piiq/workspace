name: Backend and Admin CLI Lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**/*.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'admin_cli/**/*.py'
      - 'admin_cli/openbb-admin'
      - '.github/workflows/backend-lint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@main
        with:
          version: '0.13.6'
          enable-cache: true
          working-directory: backend
          cache-dependency-glob: uv.lock
          activate-environment: true

      - name: Install lint dependencies
        run: uv sync --project backend --locked --only-group lint
      - run: |
          ruff check --output-format=github backend admin_cli admin_cli/openbb-admin
