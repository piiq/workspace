name: Backend Integration Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**/*.py'
      - 'backend/tests/fixtures/**'
      - 'backend/workspace_mcp/**'
      - 'backend/scripts/**'
      - 'backend/alembic.ini'
      - 'backend/pytest.ini'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'docker/backend/**'
      - '.github/workflows/backend-integration-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # No services block needed - testcontainers handles MySQL and Redis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@main
        with:
          version: '0.13.6'
          enable-cache: true
          working-directory: backend
          cache-dependency-glob: uv.lock
          activate-environment: true

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Run Integration Tests
        run: |
          pytest tests -v
