name: Frontend Lint and Spelling
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/plugin-sdk/src/**'
      - 'packages/plugin-sdk/biome.json'
      - 'scripts/build-plugin.ts'
      - 'scripts/prepare-frontend.ts'
      - 'scripts/biome.json'
      - 'frontend/plugin-build.ts'
      - 'examples/plugins/basic-widget/src/**'
      - 'examples/plugins/basic-widget/build.ts'
      - 'examples/plugins/basic-widget/assets/**'
      - 'examples/plugins/basic-widget/biome.json'
      - 'frontend/src/**'
      - 'frontend/biome.json'
      - 'frontend/bun.lock'
      - 'frontend/package.json'
      - 'frontend/CHANGELOG.md'
      - 'frontend/_typos.toml'
      - '.github/workflows/frontend-lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Biome Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          working-dir: frontend

      - name: Run Biome
        run: biome ci src

      - name: Lint plugin SDK
        working-directory: packages/plugin-sdk
        run: biome ci src

      - name: Lint plugin build command
        working-directory: scripts
        run: biome ci build-plugin.ts prepare-frontend.ts

      - name: Lint plugin Vite integration
        run: biome ci --config-path=../scripts plugin-build.ts

      - name: Lint example plugin
        working-directory: examples/plugins/basic-widget
        run: biome ci src build.ts

  typos:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v3

      - name: Check spelling
        uses: crate-ci/typos@master
        with:
          files: frontend/src frontend/CHANGELOG.md frontend/plugin-build.ts packages/plugin-sdk/src scripts/build-plugin.ts scripts/prepare-frontend.ts examples/plugins/basic-widget/src examples/plugins/basic-widget/build.ts
          config: frontend/_typos.toml
