name: Backend Migration Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/alembic/**'
      - 'backend/alembic.ini'
      - 'backend/api/models/**'
      - 'backend/utilities/config.py'
      - 'backend/tests/test_migration_dialects.py'
      - 'backend/tests/conftest.py'
      - 'backend/tests/fixtures/**'
      - 'backend/pytest.ini'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - '.github/workflows/backend-migration-tests.yml'

permissions:
  contents: read

jobs:
  test-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # Docker is available on GitHub runners, so the MySQL/PostgreSQL
    # testcontainers run too; SQLite needs nothing.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@main
        with:
          version: '0.13.6'
          enable-cache: true
          working-directory: backend
          cache-dependency-glob: uv.lock
          activate-environment: true

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Run migration dialect tests
        run: |
          pytest tests/test_migration_dialects.py --require-docker -v
