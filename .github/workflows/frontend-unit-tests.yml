name: Frontend Typecheck and Unit Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/plugin-sdk/src/**'
      - 'packages/plugin-sdk/package.json'
      - 'packages/plugin-sdk/bun.lock'
      - 'scripts/build-plugin.ts'
      - 'scripts/prepare-frontend.ts'
      - 'frontend/plugin-build.ts'
      - 'examples/plugins/basic-widget/**'
      - 'frontend/src/**'
      - 'frontend/tests/**'
      - 'frontend/config-profiles/**'
      - 'frontend/package.json'
      - 'frontend/bun.lock'
      - 'frontend/tsconfig*.json'
      - 'frontend/vite.config.ts'
      - 'frontend/postcss.config.cjs'
      - 'frontend/vitest.setup.ts'
      - 'frontend/.env*'
      - 'lite/render-frontend-config.full.sh'
      - '.github/workflows/frontend-unit-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  unit_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node24-bun-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('frontend/package.json', 'frontend/bun.lock', 'packages/plugin-sdk/package.json') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache plugin development dependencies
        uses: actions/cache@v4
        with:
          path: examples/plugins/basic-widget/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node24-bun-${{ steps.setup-bun.outputs.bun-version }}-plugins-${{ hashFiles('packages/plugin-sdk/package.json', 'examples/plugins/basic-widget/package.json', 'examples/plugins/basic-widget/bun.lock') }}

      - name: Install example dependencies
        working-directory: examples/plugins/basic-widget
        run: bun install --frozen-lockfile

      - name: Install SDK runtime dependencies
        working-directory: packages/plugin-sdk
        run: bun install --frozen-lockfile --production

      - name: Check example types and build
        working-directory: examples/plugins/basic-widget
        run: bun run typecheck && bun run build

      - name: Check frontend types
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test:unit
