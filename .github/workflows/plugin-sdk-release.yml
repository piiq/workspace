name: Plugin SDK Package

on:
  pull_request_target:
    types: [closed]
    branches: [main]
    paths:
      - 'packages/plugin-sdk/src/**'
      - 'packages/plugin-sdk/package.json'
      - 'packages/plugin-sdk/bun.lock'
  pull_request:
    branches: [main]
    paths:
      - 'packages/plugin-sdk/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/plugin-sdk-release.yml'

permissions:
  contents: read

concurrency:
  group: plugin-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package SDK sources
    if: github.event_name == 'pull_request' || (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Select release
        id: release
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          echo "tag=plugin-sdk-$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # Publication packages the merged commit, never the contributor's branch.
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Pack SDK
        run: |
          mkdir "$RUNNER_TEMP/package"
          cp -R packages/plugin-sdk/src "$RUNNER_TEMP/package/"
          cp packages/plugin-sdk/package.json LICENSE NOTICE "$RUNNER_TEMP/package/"
          tar -czf "$RUNNER_TEMP/workspace-plugin-sdk.tgz" -C "$RUNNER_TEMP" package

      - name: Check package contents
        run: |
          mkdir "$RUNNER_TEMP/sdk-check"
          tar -xzf "$RUNNER_TEMP/workspace-plugin-sdk.tgz" -C "$RUNNER_TEMP/sdk-check"
          for path in package.json src/index.ts src/ag-grid.ts src/build.ts LICENSE NOTICE; do
            test -f "$RUNNER_TEMP/sdk-check/package/$path"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: workspace-plugin-sdk
          path: ${{ runner.temp }}/workspace-plugin-sdk.tgz
          if-no-files-found: error

  publish:
    name: Publish SDK release
    needs: package
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workspace-plugin-sdk
          path: ${{ runner.temp }}/sdk

      - name: Publish SDK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/sdk/workspace-plugin-sdk.tgz" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/sdk/workspace-plugin-sdk.tgz" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "Plugin SDK ${SOURCE_SHA:0:7}" \
              --notes "Plugin SDK sources from commit $SOURCE_SHA." \
              --latest
          fi
