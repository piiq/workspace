name: Plugin SDK Package

on:
  push:
    branches: [main]
    paths:
      - 'packages/plugin-sdk/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/plugin-sdk-release.yml'
  pull_request:
    paths:
      - 'packages/plugin-sdk/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/plugin-sdk-release.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package SDK sources
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Select release
        if: github.event_name != 'pull_request'
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="plugin-sdk-$GITHUB_SHA"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - uses: oven-sh/setup-bun@v2

      - name: Pack SDK
        run: |
          cp LICENSE NOTICE packages/plugin-sdk/
          cd packages/plugin-sdk
          bun pm pack --filename "$RUNNER_TEMP/workspace-plugin-sdk.tgz"

      - name: Check package contents
        run: |
          mkdir "$RUNNER_TEMP/sdk-check"
          tar -xzf "$RUNNER_TEMP/workspace-plugin-sdk.tgz" -C "$RUNNER_TEMP/sdk-check"
          for path in package.json src/index.ts src/ag-grid.ts src/build.ts LICENSE NOTICE; do
            test -f "$RUNNER_TEMP/sdk-check/package/$path"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: workspace-plugin-sdk
          path: ${{ runner.temp }}/workspace-plugin-sdk.tgz
          if-no-files-found: error

  publish:
    name: Publish SDK release
    needs: package
    if: github.event_name == 'release' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workspace-plugin-sdk
          path: ${{ runner.temp }}/sdk

      - name: Publish SDK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/sdk/workspace-plugin-sdk.tgz" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/sdk/workspace-plugin-sdk.tgz" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "Plugin SDK ${SOURCE_SHA:0:7}" \
              --notes "Plugin SDK sources from commit $SOURCE_SHA." \
              --latest
          fi
