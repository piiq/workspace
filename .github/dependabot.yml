version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

  - package-ecosystem: bun
    directories:
      - /frontend
      - /packages/plugin-sdk
      - /examples/plugins/basic-widget
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

  - package-ecosystem: npm
    directory: /excel-add-in
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
